# お知らせの JSON(docs/announcements.json)を確かめる。
# 公開はブランチから直接行われるため、これは公開を止めるものではなく、あとから気付くための確認。
# 公開の前には、手元で同じコマンドを実行する(README の「お知らせの出し方」を参照)。
name: お知らせの JSON の確認

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: announcements.json を確かめる
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v7

      - name: Node.js を用意する
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Node.js のバージョンを表示する
        run: node --version

      - name: docs/announcements.json を確かめる
        run: node scripts/validate-announcements.js docs/announcements.json

      - name: 確かめるスクリプトのテスト
        run: node --test scripts/tests/validate-announcements.test.js
